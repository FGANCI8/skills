[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "renova-aura-agent-os-reference"
version = "0.1.0"
description = "Safe, mock-first Python reference for the Renova Aura Agent Operating System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.12.2,<3",
]

[project.optional-dependencies]
openai = [
  "openai-agents==0.18.2",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/renova_aura_agent_os"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
